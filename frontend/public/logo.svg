<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cd6c5c" />
      <stop offset="100%" stop-color="#e48b78" />
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1918" />
      <stop offset="100%" stop-color="#2b2a28" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Shield Base -->
  <path d="M 50 5 C 75 15 85 30 85 60 C 85 80 50 95 50 95 C 50 95 15 80 15 60 C 15 30 25 15 50 5 Z" 
        fill="url(#innerGrad)" stroke="url(#shieldGrad)" stroke-width="4" filter="url(#glow)"/>

  <!-- Keyhole Top -->
  <circle cx="50" cy="45" r="8" fill="url(#shieldGrad)" />
  <!-- Keyhole Bottom -->
  <path d="M 45 45 L 42 65 L 58 65 L 55 45 Z" fill="url(#shieldGrad)" />

  <!-- ZK Nodes (Connecting Privacy) -->
  <circle cx="30" cy="35" r="3" fill="#e8e6e3" />
  <circle cx="70" cy="35" r="3" fill="#e8e6e3" />
  <circle cx="30" cy="70" r="3" fill="#e8e6e3" />
  <circle cx="70" cy="70" r="3" fill="#e8e6e3" />
  
  <path d="M 30 35 L 45 45" stroke="#e8e6e3" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.5" />
  <path d="M 70 35 L 55 45" stroke="#e8e6e3" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.5" />
  <path d="M 30 70 L 45 60" stroke="#e8e6e3" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.5" />
  <path d="M 70 70 L 55 60" stroke="#e8e6e3" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.5" />
</svg>
